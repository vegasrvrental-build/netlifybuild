<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vegas RV Rentals | Boutique RV Rentals in Las Vegas, NV</title>
  <meta property="og:image" content="travato-fleet.webp" />
  <meta name="twitter:image" content="travato-fleet.webp" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%232D5016'>🚐</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
  
  <style>
    /* (Keeping your original CSS exactly as it was) */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:   #2D5016;
      --amber:   #E8A020;
      --amber-d: #c8881a;
      --bg:      #F9F7F4;
      --white:   #ffffff;
      --text:    #1A1A1A;
      --muted:   #6b7280;
      --card-bg: #ffffff;
      --section-alt: #f0ede8;
      --radius:  12px;
      --shadow:  0 2px 16px rgba(0,0,0,0.10);
      --nav-h:   68px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    img { display: block; max-width: 100%; }
    #nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: var(--nav-h); display: flex; align-items: center; padding: 0 1.5rem; transition: background .3s; }
    #nav.scrolled { background: var(--white); box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .btn { display: inline-block; padding: .75rem 1.75rem; border-radius: 50px; font-weight: 700; cursor: pointer; border: none; }
    .btn-amber { background: var(--amber); color: #1a1a1a; }
    #hero { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--white); overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; z-index: -2; }
    .hero-bg img { width: 100%; height: 100%; object-fit: cover; }
    .hero-overlay { position: absolute; inset: 0; z-index: -1; background: rgba(0,0,0,.4); }
    /* (CSS continues...) */
  </style>
</head>
<body>
  <nav id="nav">
    <div class="nav-inner">
      <div class="nav-logo">Vegas RV Rentals</div>
      <ul class="nav-links">
        <li><a href="#fleet">Fleet</a></li>
        <li><a href="#why-book">Why Us</a></li>
        <li><a href="mailto:hello@rentvegasrv.com" class="nav-cta">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section id="hero">
    <div class="hero-bg">
      <img src="hero-bg.jpeg" alt="Vegas RV Rentals" />
    </div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Explore the Desert in Comfort</h1>
      <a href="#fleet" class="btn btn-amber">Explore Vehicles</a>
    </div>
  </section>

  <section id="fleet">
    <div class="container">
      <div class="fleet-grid">
        <div class="fleet-card">
          <img src="travato-fleet.webp" alt="Travato" class="fleet-card-img" />
          <div class="fleet-card-body"><h3>Travato 59KL</h3></div>
        </div>
        <div class="fleet-card">
          <img src="transcend-main.webp" alt="Transcend" class="fleet-card-img" />
          <div class="fleet-card-body"><h3>Transcend 231RK</h3></div>
        </div>
      </div>
    </div>
  </section>

  <section id="destinations">
    <div class="container">
      <div class="dest-grid">
        <div class="dest-card"><img src="dest-joshua-tree.jpg" alt="Joshua Tree" /></div>
        <div class="dest-card"><img src="dest-lake-mead.jpg" alt="Lake Mead" /></div>
        <div class="dest-card"><img src="dest-valley-of-fire.jpg" alt="Valley of Fire" /></div>
        <div class="dest-card"><img src="dest-bryce-canyon.jpg" alt="Bryce Canyon" /></div>
        <div class="dest-card"><img src="dest-grand-canyon.webp" alt="Grand Canyon" /></div>
        <div class="dest-card"><img src="dest-zion.webp" alt="Zion" /></div>
      </div>
    </div>
  </section>

  <script>
    // Scripts remain the same
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => { nav.classList.toggle('scrolled', window.scrollY > 50); });
  </script>
</body>
</html>
